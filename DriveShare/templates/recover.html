{% extends 'base.html' %}
{% block content %}
    <div class="panel narrow">
        <h1>
            Reset password
        </h1>
        {% if target %}
            <p>
                Answer the three questions you selected when you registered.
            </p>
            <form method="post">
                <input type="hidden" name="csrf" value="{{csrf}}">
                <input type="hidden" name="email" value="{{email}}">
                {% for i in [1,2,3] %}
                    <label>
                        {{target['question' ~ i]}}
                        <input name="answer{{i}}" required>
                    </label>
                {% endfor %}
                <label>
                    New password
                    <input type="password" name="password" minlength="8" required>
                </label>
                <button>
                    Change password
                </button>
            </form>
        {% else %}
            <form method="get">
                <label>
                    Your account email
                    <input type="email" name="email" value="{{email}}" required>
                </label>
                <button>
                    Find my questions
                </button>
            </form>
        {% endif %}
    </div>
{% endblock %}
